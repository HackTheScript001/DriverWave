name: Build and release

# Every push to main builds a new installer and publishes it to GitHub Releases.
# Version = 1.0.<run number>, so each build is newer than the last and the in-app updater picks it up.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained single exe)
        run: >
          dotnet publish src/DriverWave/DriverWave.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer\DriverWave.iss'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DriverWave ${{ env.VERSION }}
          prerelease: false
          generate_release_notes: true
          files: output/DriverWave-${{ env.VERSION }}-Setup.exe
          body: |
            Download **DriverWave-${{ env.VERSION }}-Setup.exe** below and run it.
            Windows will ask for admin rights – drivers can't be installed without them.

            DriverWave is in beta. Problems or ideas? Open an issue.
